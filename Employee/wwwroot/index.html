<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Calculator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .calculator {
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            padding: 20px;
        }

            .calculator input {
                width: 100%;
                height: 50px;
                font-size: 24px;
                text-align: right;
                margin-bottom: 10px;
                padding: 5px;
                border-radius: 5px;
                border: 1px solid #ddd;
            }

        .button-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

            .button-container button {
                background-color: #f1f1f1;
                border: 1px solid #ddd;
                border-radius: 5px;
                padding: 20px;
                font-size: 20px;
                cursor: pointer;
                transition: background-color 0.2s;
            }

                .button-container button:hover {
                    background-color: #e2e2e2;
                }

                .button-container button:active {
                    background-color: #ddd;
                }

            .button-container .equals {
                background-color: #4CAF50;
                color: white;
            }

            .button-container .clear {
                background-color: #f44336;
                color: white;
            }
    </style>
</head>
<body>
    <div class="calculator">
        <input type="text" id="display" disabled>

        <div class="button-container">
            <button onclick="appendNumber('7')">7</button>
            <button onclick="appendNumber('8')">8</button>
            <button onclick="appendNumber('9')">9</button>
            <button onclick="operate('/')">/</button>

            <button onclick="appendNumber('4')">4</button>
            <button onclick="appendNumber('5')">5</button>
            <button onclick="appendNumber('6')">6</button>
            <button onclick="operate('*')">*</button>

            <button onclick="appendNumber('1')">1</button>
            <button onclick="appendNumber('2')">2</button>
            <button onclick="appendNumber('3')">3</button>
            <button onclick="operate('-')">-</button>

            <button onclick="appendNumber('0')">0</button>
            <button onclick="appendDecimal()">.</button>
            <button onclick="clearDisplay()" class="clear">C</button>
            <button onclick="operate('+')">+</button>

            <button onclick="calculate()" class="equals" colspan="4">=</button>
            <button onclick="operate('%')">%</button>
        </div>
    </div>

    <script>
        let currentInput = '';
        let previousInput = '';
        let operator = '';

        // Append numbers to the display
        function appendNumber(number) {
            currentInput += number;
            updateDisplay(currentInput);
        }

        // Append decimal to the display
        function appendDecimal() {
            if (!currentInput.includes('.')) {
                currentInput += '.';
                updateDisplay(currentInput);
            }
        }

        // Set operator
        function operate(op) {
            if (currentInput === '') return; // Do nothing if no number is input

            if (previousInput !== '') {
                calculate(); // If there's a previous input, calculate the result
            }

            operator = op;
            previousInput = currentInput;
            currentInput = '';
        }

        // Update the display
        function updateDisplay(value) {
            document.getElementById('display').value = value;
        }

        // Calculate the result
        function calculate() {
            let result;
            const prev = parseFloat(previousInput);
            const current = parseFloat(currentInput);

            if (isNaN(prev) || isNaN(current)) return; // If either input is not a number, do nothing

            switch (operator) {
                case '+':
                    result = prev + current;
                    break;
                case '-':
                    result = prev - current;
                    break;
                case '*':
                    result = prev * current;
                    break;
                case '/':
                    if (current === 0) {
                        alert("Cannot divide by 0!");
                        return;
                    }
                    result = prev / current;
                    break;
                case '%':
                    if (current === 0) {
                        alert("Cannot modulo by 0!");
                        return;
                    }
                    result = prev % current;
                    break;
                default:
                    return;
            }

            currentInput = result.toString();
            operator = '';
            previousInput = '';
            updateDisplay(currentInput);
        }

        // Clear the display
        function clearDisplay() {
            currentInput = '';
            previousInput = '';
            operator = '';
            updateDisplay(currentInput);
        }

        // Handle keyboard input
        document.addEventListener('keydown', function (event) {
            const key = event.key;
            if (key >= '0' && key <= '9') {
                appendNumber(key); // Handle number keys
            } else if (key === '.') {
                appendDecimal(); // Handle decimal point
            } else if (key === '+' || key === '-' || key === '*' || key === '/' || key === '%') {
                operate(key); // Handle operators
            } else if (key === 'Enter') {
                calculate(); // Handle Enter key for calculation
            } else if (key === 'Backspace') {
                currentInput = currentInput.slice(0, -1); // Handle backspace (remove last character)
                updateDisplay(currentInput);
            } else if (key === 'Escape') {
                clearDisplay(); // Handle Escape key for clear
            }
        });
    </script>
</body>
</html>
